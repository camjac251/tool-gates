name: Docs

on:
  push:
    branches: [main]
    paths:
      - "rules/**"
      - "build.rs"
      - "src/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "rules/**"
      - "build.rs"
      - "src/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build site
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install zig (C cross-compiler for the wasm tree-sitter scanner)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install docs toolchain
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          # wasm-bindgen-cli must match the wasm-bindgen crate version (Cargo.lock).
          tool: mdbook@0.5.4,wasm-bindgen-cli@0.2.126

      - name: Install Binaryen
        run: npm install --global binaryen@129.0.0

      - name: Regenerate reference docs
        run: cargo run --locked --release -- rules export --format md

      - name: Drift gate (committed docs must match generated)
        run: |
          if ! git diff --exit-code docs/src/gates docs/src/security-floor.md docs/src/hints.md docs/src/security-reminders.md docs/src/design-lint.md; then
            echo "::error::Generated docs are stale. Run 'cargo run --locked --release -- rules export --format md' and commit the result."
            exit 1
          fi

      - name: Build WASM simulator
        # Mirrors `mise run build-wasm`. zig cc compiles tree-sitter-bash's C
        # scanner for wasm32: the CFLAGS -target wasm32-wasi is appended after
        # cc's own --target and clang honors the last one, so zig supplies libc
        # headers; the five libc symbols resolve to the Rust shims in src/lib.rs
        # at link time.
        env:
          CC_wasm32_unknown_unknown: "zig cc"
          CFLAGS_wasm32_unknown_unknown: "-target wasm32-wasi"
        run: |
          cargo build --locked --profile release-wasm --lib --target wasm32-unknown-unknown --features wasm
          wasm-bindgen --target web --no-typescript --out-dir docs/src/wasm/ target/wasm32-unknown-unknown/release-wasm/tool_gates.wasm
          wasm-opt -Oz --enable-bulk-memory -o docs/src/wasm/tool_gates_bg.wasm docs/src/wasm/tool_gates_bg.wasm

      - name: Build mdBook
        run: mdbook build docs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
