name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Versions pinned to match mise.toml so CI and local agree on formatting.
      - name: Install taplo
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: taplo@0.10.0

      - name: biome (js/css/json)
        run: npx --yes @biomejs/biome@2.4.16 ci

      - name: prettier (md/yaml)
        # .prettierignore decides which files skip formatting. prettier errors on
        # any symlink passed to it explicitly, so drop all symlinks from the list
        # before handing it to prettier.
        run: |
          git ls-files '*.md' '*.yml' '*.yaml' \
            | while IFS= read -r f; do [ -L "$f" ] || printf '%s\n' "$f"; done \
            | xargs -r npx --yes prettier@3.9.6 --check

      - name: README GitHub rendering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST /markdown \
            -F text=@README.md \
            -f mode=gfm \
            -f context="$GITHUB_REPOSITORY" \
            > "$RUNNER_TEMP/readme.html"
          python3 .github/scripts/check_readme_gfm.py "$RUNNER_TEMP/readme.html"

      - name: taplo (toml)
        run: git ls-files '*.toml' | xargs taplo fmt --check
